<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 蓝牙小车</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: Arial, sans-serif;
background: #000;
color: #fff;
text-align: center;
padding: 10px;
}
.container {
max-width: 600px;
margin: 0 auto;
}
h1 {
font-size: 22px;
margin: 10px 0;
}
.video-box {
width: 100%;
background: #222;
border-radius: 8px;
overflow: hidden;
margin-bottom: 15px;
}
#video {
width: 100%;
display: block;
}
.controls {
display: grid;
grid-template-columns: repeat(3, 80px);
grid-template-rows: repeat(3, 80px);
gap: 8px;
justify-content: center;
margin: 15px 0;
}
.btn {
width: 80px;
height: 80px;
font-size: 30px;
border: none;
border-radius: 8px;
background: #333;
color: #fff;
touch-action: manipulation;
}
.btn:active {
background: #666;
}
.btn-up { grid-column: 2; grid-row: 1; }
.btn-left { grid-column: 1; grid-row: 2; }
.btn-stop { grid-column: 2; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }
.btn-down { grid-column: 2; grid-row: 3; }
.status {
margin: 10px 0;
font-size: 16px;
color: #bbb;
}
</style>
</head>
<body>
<div class="container">
<h1>ESP32 蓝牙小车</h1>

<div class="video-box">
<video id="video" autoplay muted playsinline></video>
</div>

<div class="controls">
<button class="btn btn-up" id="btnUp">↑</button>
<button class="btn btn-left" id="btnLeft">←</button>
<button class="btn btn-stop" id="btnStop">■</button>
<button class="btn btn-right" id="btnRight">→</button>
<button class="btn btn-down" id="btnDown">↓</button>
</div>

<p class="status" id="status">未连接</p>
</div>

<script>
let bleServer, service, characteristic;
const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

const statusEl = document.getElementById("status");
const videoEl = document.getElementById("video");

// 蓝牙连接
async function connectBLE() {
try {
statusEl.textContent = "连接中...";
const device = await navigator.bluetooth.requestDevice({
filters: [{ name: "ESP32_CAR" }],
optionalServices: [SERVICE_UUID]
});
bleServer = await device.gatt.connect();
service = await bleServer.getPrimaryService(SERVICE_UUID);
characteristic = await service.getCharacteristic(CHAR_UUID);
statusEl.textContent = "已连接";
} catch (e) {
statusEl.textContent = "连接失败";
console.error(e);
}
}

// 发送指令
function sendCmd(cmd) {
if (!characteristic) return;
let data = new TextEncoder().encode(cmd);
characteristic.writeValue(data);
}

// 按键事件
document.getElementById("btnUp").addEventListener("mousedown", ()=>sendCmd("f"));
document.getElementById("btnUp").addEventListener("touchstart", ()=>sendCmd("f"));
document.getElementById("btnUp").addEventListener("mouseup", ()=>sendCmd("s"));
document.getElementById("btnUp").addEventListener("touchend", ()=>sendCmd("s"));

document.getElementById("btnDown").addEventListener("mousedown", ()=>sendCmd("b"));
document.getElementById("btnDown").addEventListener("touchstart", ()=>sendCmd("b"));
document.getElementById("btnDown").addEventListener("mouseup", ()=>sendCmd("s"));
document.getElementById("btnDown").addEventListener("touchend", ()=>sendCmd("s"));

document.getElementById("btnLeft").addEventListener("mousedown", ()=>sendCmd("l"));
document.getElementById("btnLeft").addEventListener("touchstart", ()=>sendCmd("l"));
document.getElementById("btnLeft").addEventListener("mouseup", ()=>sendCmd("s"));
document.getElementById("btnLeft").addEventListener("touchend", ()=>sendCmd("s"));

document.getElementById("btnRight").addEventListener("mousedown", ()=>sendCmd("r"));
document.getElementById("btnRight").addEventListener("touchstart", ()=>sendCmd("r"));
document.getElementById("btnRight").addEventListener("mouseup", ()=>sendCmd("s"));
document.getElementById("btnRight").addEventListener("touchend", ()=>sendCmd("s"));

document.getElementById("btnStop").addEventListener("click", ()=>sendCmd("s"));

// 摄像头（请求权限）
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => { videoEl.srcObject = stream; })
.catch(e => console.error("摄像头权限失败", e));

// 页面加载自动连接
window.addEventListener("load", connectBLE);
</script>
</body>
</html>
