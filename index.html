<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body { background: #111; color: white; text-align: center; }
        #canvas { border: 3px solid #fff; margin: 10px auto; }
        button { padding: 12px 24px; font-size: 16px; margin: 8px; }
    </style>
</head>
<body>

    <button onclick="connectBLE()">连接蓝牙小车</button>
    <button onclick="startCamera()">启动摄像头</button>
    <button onclick="reset()">停止</button><br>
    
    <canvas id="canvas" width="640" height="480"></canvas>

<script>
// ================== 你的蓝牙UUID ==================
const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHAR_UUID    = "0000ffe1-0000-1000-8000-00805f9b34fb";

let characteristic = null;
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let video = document.createElement("video");
video.width = 640;
video.height = 480;
video.autoplay = true;

let target_blue = null;
let lastCmd = "";

// ================== 鼠标选点 ==================
canvas.onclick = (e) => {
    let r = canvas.getBoundingClientRect();
    target_blue = { x: e.clientX - r.left, y: e.clientY - r.top };
};

// ================== 蓝牙 ==================
async function connectBLE() {
    try {
        let device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true, optionalServices: [SERVICE_UUID]
        });
        let server = await device.gatt.connect();
        let service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
        alert("✅ 蓝牙连接成功！");
    } catch (err) {
        alert("❌ 连接失败：" + err.message);
    }
}

async function send(cmd) {
    if (!characteristic || cmd === lastCmd) return;
    try {
        await characteristic.writeValue(new TextEncoder().encode(cmd));
        lastCmd = cmd;
    } catch (e) {}
}

function reset() { send("S"); lastCmd = ""; target_blue = null; }

// ================== 【修复】启动摄像头 ==================
async function startCamera() {
    let stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    requestAnimationFrame(loop);
}

// ================== RGB → HSV 和 OpenCV 完全一致 ==================
function rgb2hsv(r,g,b){
    let ra=r/255,ga=g/255,ba=b/255;
    let max=Math.max(ra,ga,ba),min=Math.min(ra,ga,ba);
    let h=0,s=0,v=max,d=max-min;
    s=max===0?0:d/max;
    if(max!==min){
        switch(max){
            case ra:h=(ga-ba)/d+(ga<ba?6:0);break;
            case ga:h=(ba-ra)/d+2;break;
            case ba:h=(ra-ga)/d+4;break;
        }
        h/=6;
    }
    return [h*180,s,v];
}

// ==================================================================
// 🔥🔥🔥 最强降噪：OpenCV 轮廓 + 最大色块 + 0噪点（完全保留）
// ==================================================================
function findBiggestCenter(hMin,hMax,sMin,vMin){
    let w=640,h=480;
    let data=ctx.getImageData(0,0,w,h).data;
    let grid=new Array(w*h).fill(0);
    let total=0;

    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            let i=(y*w+x)*4;
            let hsv=rgb2hsv(data[i],data[i+1],data[i+2]);
            let hue=hsv[0],sat=hsv[1],val=hsv[2];
            if(hue>=hMin && hue<=hMax && sat>=sMin && val>=vMin){
                grid[y*w+x]=1; total++;
            }
        }
    }

    if(total<150) return null;

    let visited=new Array(w*h).fill(false);
    let best={count:0,x:0,y:0};
    const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
    
    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            let idx=y*w+x;
            if(grid[idx]===1 && !visited[idx]){
                let q=[{x,y}],sumX=0,sumY=0,c=0;
                visited[idx]=true;
                while(q.length){
                    let p=q.shift(); sumX+=p.x; sumY+=p.y; c++;
                    for(let d of dirs){
                        let nx=p.x+d[0],ny=p.y+d[1];
                        let nid=ny*w+nx;
                        if(nx>=0&&nx<w&&ny>=0&&ny<h&&grid[nid]&&!visited[nid]){
                            visited[nid]=true; q.push({x:nx,y:ny});
                        }
                    }
                }
                if(c>best.count) best={count:c,x:sumX/c,y:sumY/c};
            }
        }
    }

    return best.count>80 ? {x:best.x,y:best.y} : null;
}

// 阈值 100% 复制你 Python
function red(){ return findBiggestCenter(0,15,0.47,0.39); }
function green(){ return findBiggestCenter(40,70,0.2,0.2); }

// ================== 主循环 ==================
function loop(){
    ctx.drawImage(video,0,0,640,480);
    let R=red(), G=green();

    if(R){ctx.beginPath();ctx.arc(R.x,R.y,6,0,Math.PI*2);ctx.fillStyle="red";ctx.fill();}
    if(G){ctx.beginPath();ctx.arc(G.x,G.y,6,0,Math.PI*2);ctx.fillStyle="lime";ctx.fill();}
    if(target_blue){ctx.beginPath();ctx.arc(target_blue.x,target_blue.y,45,0,Math.PI*2);ctx.strokeStyle="blue";ctx.lineWidth=2;ctx.stroke();}

    if(R&&G&&target_blue){
        let rx=R.x,ry=R.y,gx=G.x,gy=G.y,bx=target_blue.x,by=target_blue.y;
        if(Math.hypot(gx-bx,gy-by)<90){send("S");target_blue=null;requestAnimationFrame(loop);return;}

        let cross=(gx-rx)*(by-ry)-(gy-ry)*(bx-rx);
        let straight=Math.abs(cross)<30000;
        let d1=Math.hypot(gx-rx,gy-ry);
        let d2=Math.hypot(bx-gx,by-gy);
        let dt=Math.hypot(bx-rx,by-ry);
        let order=(d1+d2)<dt*1.3;

        if(straight&&order)send("F");
        else send(cross>0?"L":"R");
    }else{
        send("S");
    }
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
