<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: #fff;
            touch-action: manipulation;
        }
        .btn-red {
            background: #dc3545;
        }
        #canvas {
            border: 2px solid #fff;
            max-width: 100%;
            height: auto;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="connectBLE()">连接蓝牙小车</button>
        <button class="btn" onclick="startCamera()">启动摄像头</button>
        <button class="btn btn-red" onclick="reset()">停止</button>
    </div>
    <canvas id="canvas" width="640" height="480"></canvas>

<script>
const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

let characteristic = null;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.createElement("video");
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");
video.width = 640;
video.height = 480;

async function connectBLE() {
    try {
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
    } catch (e) {
        alert("连接失败：" + e.message);
    }
}

async function sendCmd(cmd) {
    if (!characteristic) return;
    try {
        await characteristic.writeValue(new TextEncoder().encode(cmd));
    } catch (e) {}
}

function reset() {
    sendCmd("S");
}

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(loop);
    } catch (e) {
        alert("摄像头启动失败：" + e.message);
    }
}

function loop() {
    ctx.drawImage(video, 0, 0, 640, 480);
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
